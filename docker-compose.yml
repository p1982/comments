services:
  postgres:
    image: postgres:16-alpine
    container_name: comments-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_DB: comments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comments -d comments']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
